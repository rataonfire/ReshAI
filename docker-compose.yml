version: '3.8'

services:
  # ========== PostgreSQL + pgvector ==========
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hackathon-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-hackathon}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d   # автозапуск SQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev} -d ${POSTGRES_DB:-hackathon}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========== Redis ==========
  redis:
    image: redis:7-alpine
    container_name: hackathon-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========== MinIO (S3-совместимое хранилище) ==========
  minio:
    image: minio/minio:latest
    container_name: hackathon-minio
    command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_PORT:-9000}/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========== Ollama (только для ML-разработчиков) ==========
  ollama:
    image: ollama/ollama:latest
    container_name: hackathon-ollama
    profiles: ["ml"]   # запускается только с флагом --profile ml
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Для автоматической загрузки модели при первом запуске:
    # command: >
    #   sh -c "ollama serve & sleep 3 && ollama pull qwen2.5:7b && wait"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data: